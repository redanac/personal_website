<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redha Nacef Personal Website</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap">
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <nav class="desktop-icons" aria-label="Desktop">
        <button class="desktop-icon" type="button"><img src="/icons/my-machine.svg" alt=""><span>My Machine</span></button>
        <button class="desktop-icon" type="button"><img src="/icons/net-surfer.svg" alt=""><span>Net Surfer</span></button>
        <button class="desktop-icon" type="button"><img src="/icons/scribe.svg" alt=""><span>Scribe</span></button>
        <button class="desktop-icon" type="button"><img src="/icons/doodle.svg" alt=""><span>Doodle</span></button>
        <button class="desktop-icon" type="button"><img src="/icons/bomb-hunt.svg" alt=""><span>Bomb Hunt</span></button>
        <button class="desktop-icon" type="button"><img src="/icons/boom.svg" alt=""><span>BOOM</span></button>
        <button class="desktop-icon" type="button"><img src="/icons/ros2.svg" alt=""><span>ROS 2</span></button>
        <button class="desktop-icon" type="button"><img src="/icons/bin.svg" alt=""><span>Bin</span></button>
    </nav>
    <main class="page">
        <section class="window" data-drag="page">
            <div class="title-bar">
                <span class="title-bar-text">MS-DOS Prompt - C:\REDHA\README.TXT</span>
                <div class="title-bar-controls" aria-hidden="true">
                    <span>_</span><span>&#9633;</span><span>&times;</span>
                </div>
            </div>
            <div class="window-body terminal">
                <h1>Redha Nacef's Personal Website</h1>
                <p class="instructions">
                    C:\REDHA&gt; Hover over a floppy disk to take a closer look. Click one to load it.<span class="cursor">_</span>
                </p>
            </div>
        </section>
        <!-- canvas has rounded top edges-->
        <canvas style="border-radius: 10px 10px 0 0;" class="webgl"></canvas>
        <section class="monitor" id="monitor">
            <div class="monitor-bezel">
                <div class="monitor-screen crt" id="monitor-screen">
                    <div class="screen-content" id="screen-content"></div>
                </div>
                <div class="monitor-footer">
                    <span class="monitor-brand">RN-86</span>
                    <span class="power-led" id="power-led"></span>
                </div>
            </div>
        </section>
    </main>
    <script type="module" src="./script.js"></script>
    <script type="module" src="./desktop.js"></script>
</body>
</html>
